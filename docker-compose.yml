version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ists-dashboard
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=production
